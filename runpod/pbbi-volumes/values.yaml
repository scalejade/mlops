volume:
  # 200 GB: v4.5-27b-pbbi base (55.6) + LoRA adapters (~0.3 each) + HF cache
  # slack — room for a second base or one merged model (55.6) beside the live one.
  # Volumes can grow but never shrink.
  size: 200

  # MUST match the dataCenterIds of everything that mounts it: pbbi-serverless-extraction and
  # pbbi-loader. A network volume is region-local; nothing in another region can
  # attach it.
  #
  # CA-MTL-3, checked 2026-10-13: network volumes, accepted by REST v1 for pods
  # and endpoints, and the RTX PRO 6000 Blackwell Server Edition pbbi-serverless-extraction
  # pins in stock ("Low"). Ruled out: US-CO-1 (REST v1 rejects it), US-CA-2
  # (serving GPU listed but not in stock), EU-FR-1 (no serving GPU at all).
  # Training no longer needs it, so H200 stock here does not matter.
  dataCenterId: CA-MTL-3

# Not sent to RunPod. Read by `deploy.py plan` so the cost is on screen before
# you create something that bills continuously whether or not it is being read.
cost:
  usd_per_gb_month: 0.07
  note: |
    Flat rate, billed whether or not a pod is running. 200 GB is ~$14/mo.
    Cheaper than a pod volume disk ($0.10/GB running, $0.20/GB stopped) and it
    survives deletion of everything that mounts it.
