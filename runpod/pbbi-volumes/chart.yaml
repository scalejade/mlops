# Network volume. Serving's checkpoint storage.
#
# pbbi-serverless-extraction mounts it at /runpod-volume; pbbi-loader (a CPU pod) fills it at
# /workspace — the same directory, so what the loader pulls is what the workers
# load. Without it every worker downloads the full checkpoint itself on a cold
# start: ~2h instead of ~26s. Training does not use it (its own disk, any region).
#
#   python runpod/deploy.py plan  pbbi-volumes
#   python runpod/deploy.py apply pbbi-volumes

apiVersion: v1
kind: volume
name: pbbi-volumes
version: 0.1.0
description: Serving checkpoint storage — base model + LoRA adapters, filled by pbbi-loader.

# Volumes are the root of the dependency graph — nothing to depend on.
dependencies: []
