# Field names under `template:` and `endpoint:` map 1:1 to the RunPod REST API,
# so there is no hidden translation layer to reason about.

# Engine args are NOT here. They live in models/<model>/model.config so the same
# model gets the same engine config wherever it is served. deploy.py reads that
# file and sends it as the template env.
#
# A directory under models/, set by MODEL in this folder's .env (template:
# .env.example) — so switching what the endpoint serves is a .env edit, not a
# chart change. `deploy.py plan pbbi-serverless-extraction` prints what it resolved to.
model: ${MODEL}

# The LoRA served on top of `model`, read from the network volume (pbbi-loader
# puts it at /runpod-volume/adapters/<repo name>/<revision>; `make volume-fill`).
# Callers get it by sending `name` as the request's "model"; the base model's own
# name still answers without it. `adapter: null` serves the base only.
adapter:
  name: pbbi-clause-extraction
  repo: scalejade/pbbi-clause-extraction-lora
  revision: ${ADAPTER_REVISION}    # the tag train.py pushed, e.g. v0.1.0

template:
  # Pin the image. The stock RunPod vLLM template moves without warning, and the
  # engine version is the single biggest source of deployment failure here.
  # v2.28.0 = vLLM 0.30.0 (Qwen3.5's gated-deltanet needs a recent vLLM). From
  # v2.27 the worker maps any env var named like a `vllm serve` flag onto it —
  # that is how ENABLE_LORA / LORA_MODULES / MODEL_REVISION reach vLLM.
  imageName: runpod/worker-v1-vllm:v2.28.0
  containerDiskInGb: 20
  volumeMountPath: /runpod-volume   # serverless mounts here; pods mount /workspace

endpoint:
  # Any of these, whichever is free: one GPU type alone left the endpoint with no
  # worker on 2026-10-16. Each holds the 55.6 GB base + KV cache, and all three
  # do fp8 KV (KV_CACHE_DTYPE=fp8) natively — A100s are left out for that reason.
  gpuTypeIds:
    - "NVIDIA RTX PRO 6000 Blackwell Server Edition"   # 96 GB
    - "NVIDIA H100 NVL"                                # 94 GB
    - "NVIDIA H200"                                    # 141 GB
    - "NVIDIA H100 80GB HBM3"                          # 80 GB: 55.6 weights + ~14 free; one
                                                       # 262k sequence is 8 GiB of fp8 KV
                                                       # (16 full-attention layers x 32 KiB/token)
  gpuCount: 1                    # GPUs PER WORKER. Must equal TENSOR_PARALLEL_SIZE.
  computeType: GPU

  workersMin: 0                  # >0 keeps a warm pool: no cold start, but you pay idle
  workersMax: 1                  # REPLICAS. Not GPUs. These are different things.

  idleTimeout: 60
  scalerType: QUEUE_DELAY        # QUEUE_DELAY | REQUEST_COUNT
  scalerValue: 4
  executionTimeoutMs: 1800000    # 30 min — long documents are slow, not stuck

  # Pin the region, and pin it to the volume's region. Workers spread across
  # datacenters get throttled, and a volume in another region will not attach.
  dataCenterIds:
    - "CA-MTL-3"                 # = pbbi-volumes' dataCenterId

  flashboot: true

  # networkVolumeId is injected from the pbbi-volumes dependency. Do not
  # hardcode it here — the dependency is what keeps the two regions in sync.

# Not sent to RunPod — read by callers and by the preflight checks.
request_defaults:
  max_tokens: 24576              # measured need is 17,258. Do not set below it.
  temperature: 0.0
  # finish_reason == "length" is a FAILURE. The response is HTTP 200 with content
  # silently missing. Callers must raise on it.
