# RunPod POD — persistent vLLM server for scalejade/qwen-sea-lion-v4.5-27b-it
#
# A pod, not a serverless endpoint: it stays up, bills by the hour, and has no cold
# start. That is what you want for a batch extraction run. Serverless is for bursty
# traffic that can tolerate a cold start; a 45k-token document that takes minutes to
# process is not that.
#
# Sizing produced by:  python runpod/scripts/vram_budget.py --model qwen-sea-lion-v4.5-27b-it

name: sea-lion-v45-27b
model: scalejade/qwen-sea-lion-v4.5-27b-it   # mirror re-cloned and verified 2026-08-20

# ---------------------------------------------------------------- GPU
# 55.6 GB of bf16 weights + 32 KiB/token of fp8 KV cache + ~4 GB overhead.
# At 262,144 context x 2 concurrent sequences the total is 75.6 GB.
gpu:
  type: "NVIDIA RTX PRO 6000 Blackwell Server Edition"
  vram_gb: 96              # 86.4 GB usable at GPU_MEMORY_UTILIZATION=0.90
  count: 1                 # MUST equal TENSOR_PARALLEL_SIZE
  price_per_hour_usd: 2.09

  # Alternatives, same model:
  #   H200 141GB  $4.59/hr  262,144 x 8 concurrent  — pick this if you need throughput
  #   H100 NVL 94GB $3.19/hr 262,144 x 2 concurrent — same capability, costs more
  #   H100 SXM 80GB $3.29/hr 262,144 x 1 concurrent — no headroom, not worth it
  # Do NOT use anything at or below 80 GB: 55.6 GB of weights leaves too little for KV.

# ---------------------------------------------------------------- disk
disk:
  # Container disk holds the Docker image and scratch. Wiped every time the pod stops.
  container_gb: 50

  # TRIAL SETTING: volume disk, not a network volume.
  #
  # Volume disk lives and dies with the pod. It survives STOP but not DELETE.
  # That is fine for a trial as long as you stop the pod rather than delete it —
  # deleting means re-downloading 55.6 GB on the next run.
  #
  # Switch to a network volume before this becomes production:
  #   - $0.07/GB/mo flat vs $0.10 running / $0.20 stopped
  #   - survives pod deletion
  #   - shareable with the serverless endpoint, which needs one anyway
  # Mount path is /workspace either way on a pod (serverless uses /runpod-volume).
  type: volume_disk        # volume_disk | network_volume
  volume_gb: 150
  volume_mount_path: /workspace

# ---------------------------------------------------------------- container
container:
  # TRIAL: use `latest`. Qwen3.5 is a new architecture, and for a first boot the
  # newest engine is the one most likely to recognise it. Pin only AFTER it works.
  #
  # Once the pod is up, read the real version and put it here:
  #     python -c "import vllm; print(vllm.__version__)"
  #
  # Do not copy a tag from memory — verify it exists on Docker Hub first. `latest`
  # moving under you is a smaller risk than a tag that does not exist and never boots.
  #
  # Known-good fallback if `latest` rejects the architecture:
  #     vllm/vllm-openai:v0.17.1-cu130   (the community cu130-qwen3.5-27B template)
  image: vllm/vllm-openai:latest
  ports:
    - "8000/http"          # OpenAI-compatible API
    - "22/tcp"             # SSH, for debugging a boot failure

  # TRIAL VALUES — hardcoded on purpose to get a pod up fast.
  # Before this is anything but a trial: move HF_TOKEN into a RunPod Secret
  # ({{ RUNPOD_SECRET_hf_token }}) and give VLLM_API_KEY a real random value.
  # Full list also in env.txt, formatted for RunPod's raw editor.
  env:
    HF_TOKEN: ${HF_TOKEN}                       # set as a RunPod Secret, never plaintext
    HF_HOME: /workspace/.huggingface            # weights land on the volume, not container disk
    HF_XET_HIGH_PERFORMANCE: "1"                # ~3-5x faster pulls; the first run managed only 17 MB/s without it
    VLLM_CACHE_ROOT: /workspace/.vllm-cache     # persists torch.compile output across restarts
    VLLM_API_KEY: sk-jago-ww8ic2q2mby6pj2miuq3vjeb
    PYTORCH_ALLOC_CONF: expandable_segments:True
    PUBLIC_KEY: "null"                          # replace with an SSH key to keep shell access

    # HF_HUB_ENABLE_HF_TRANSFER: only if the image ships the hf_transfer package.
    # Without it, every download dies with ImportError. Not worth the risk by default.

# ---------------------------------------------------------------- vLLM engine
# Flags for `vllm serve`, generated by runpod/pods/start-vllm.sh.
engine:
  max_model_len: 262144          # upstream text_config.max_position_embeddings, verified 2026-08-20
  max_num_seqs: 2                # 262,144 x 2 = 75.6 GB total; 4 would need 91.6 GB
  gpu_memory_utilization: 0.90
  kv_cache_dtype: fp8            # halves KV cost; the reason 262k fits on one GPU
  dtype: auto
  tensor_parallel_size: 1        # must equal gpu.count
  enable_prefix_caching: false   # Mamba-layer prefix caching is experimental in vLLM, and a
                                 # single-shot request has no prefix to reuse. Turn on for batches.
  enable_chunked_prefill: true
  max_num_batched_tokens: 8192
  trust_remote_code: false
  served_model_name: scalejade/qwen-sea-lion-v4.5-27b-it   # keeps request JSON unchanged

# ---------------------------------------------------------------- workload
# The Jago extraction request, for reference:
#   input 56,620 + max_tokens 103,410 = 160,030 peak -> fits in one call at 262,144.
#   At max_model_len 163,840 it also fits, with only 3,810 tokens of margin.
workload:
  peak_context_needed: 160030
  fits_single_request: true
