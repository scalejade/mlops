# RunPod serverless endpoint. Field names map 1:1 to the RunPod REST API
# (https://rest.runpod.io/v1) so there is no hidden translation layer.
#
# Deploy:  python runpod/deploy.py apply pjp-clause-extraction
# Preview: python runpod/deploy.py plan  pjp-clause-extraction

name: pjp-clause-extraction

# Engine args come from models/<model>/model.config and are injected as the
# template's env. ${VAR} in that file is resolved from .env at deploy time.
model: qwen-sea-lion-v4-32b-it
adapter: null

template:
  # Pin the image. The stock RunPod vLLM template moves without warning, and
  # the engine version is the single biggest source of deployment failure here.
  imageName: runpod/worker-v1-vllm:v2.25.1stable-cuda12.1.0
  containerDiskInGb: 20
  volumeMountPath: /runpod-volume
  isServerless: true

endpoint:
  gpuTypeIds:
    - "NVIDIA RTX PRO 6000 Blackwell Server Edition"
  gpuCount: 1                    # GPUs PER WORKER. Must equal TENSOR_PARALLEL_SIZE.
  computeType: GPU

  workersMin: 0                  # >0 keeps a warm pool: no cold start, but you pay idle
  workersMax: 1                  # REPLICAS. Not GPUs. These are different things.

  idleTimeout: 60
  scalerType: QUEUE_DELAY        # QUEUE_DELAY | REQUEST_COUNT
  scalerValue: 4
  executionTimeoutMs: 1800000    # 30 min — long documents are slow, not stuck

  # REQUIRED. Without a network volume every worker re-downloads the checkpoint:
  # ~2h cold start instead of ~26s. Set RUNPOD_NETWORK_VOLUME_ID in .env.
  networkVolumeId: ${RUNPOD_NETWORK_VOLUME_ID}

  # Pin the region. Workers spread across datacenters get throttled.
  dataCenterIds:
    - "US-NC-1"

  flashboot: true

# Not sent to RunPod — read by callers and by the preflight checks.
request_defaults:
  max_tokens: 24576              # measured need is 17,258. Do not set below it.
  temperature: 0.0
  # finish_reason == "length" is a FAILURE. The response is HTTP 200 with
  # content silently missing. Callers must raise on it.
