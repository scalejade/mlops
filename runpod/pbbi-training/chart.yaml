# Training pod. One H200, rented per run, deleted after.
#
# Not deployed with deploy.py: a training pod runs no engine, it waits for ssh.
# training/scripts/pod.py reads this chart and the Makefile drives it:
#
#   make pod-plan       # validate + price, sends nothing
#   make pod-up         # the meter starts here
#   make train
#   make pod-delete pbbi-training   # once the adapter is on the Hub
#
# Its own disk, no network volume: training goes wherever an H200 is free, and
# the adapter reaches serving through the Hub. pbbi-loader fills serving's volume.

apiVersion: v1
kind: pod
name: pbbi-training
version: 0.1.0
description: Single-GPU Unsloth LoRA fine-tuning for PBBI clause extraction.
