# PBBI analysis — LoRA, one H200.
#
# ============================================================================
#  DRAFT — NOT READY TO TRAIN.  `status: draft` below makes train.py and
#  run.sh refuse it. Remove that line only once every TODO in here is done.
# ============================================================================
#
# Copied from pbbi-extraction.yaml: same base model, same pod, same LoRA shape.
# What is NOT defined yet — and what every TODO below waits on:
#   - the analysis task itself: the app's request (system prompt + user turn),
#     the way preparation/prompts/extraction_system.md defines extraction
#   - its training data: train / eval .jsonl in that exact request shape
#   - how to score a reply (extraction uses preparation/app_request.py's parser)
#
#   python training/scripts/train.py training/configs/pbbi-analysis.yaml --dry-run
#   python training/scripts/train.py training/configs/pbbi-analysis.yaml

status: draft

run_name: pbbi-analysis-lora-v0.1.0

model:
  # The app's extraction model on sys-prompt is scalejade/qwen-sea-lion-v4.5-27b-it
  # (domain.RunPodModelSeaLion). This is the dedicated PBBI clone of those same
  # weights, so the adapter attaches to what the app calls.
  base: scalejade/qwen-sea-lion-v4.5-27b-pbbi
  revision: 8d32a4b9c89c9272ae8d660792182da7950955a2

  # From build.py's report on the 2026-10-10 build, exact tokenizer counts:
  # longest row 29,900 tokens (system prompt 13,963 of it), median 20,817.
  # build.py caps rows at --max-row-tokens 30,000, which leaves room for the chat
  # template. The README's H200 table calls 32k "tight" at batch 1 — watch peak
  # VRAM in the first steps; the order to reach for on OOM is in training/README.md.
  max_seq_length: 32768     # TODO: size to the analysis rows — build.py's report, longest row + template

  load_in_4bit: false       # 55.56 GB of weights on 141 GB — 4-bit is the long-context fallback
  dtype: bfloat16           # qwen3_5's gated-deltanet layers NaN their grads in fp16
  text_only: true           # skip the vision tower: ~2.4 GB less VRAM
  chat_template: qwen-3     # names the response markers only; does NOT replace the repo's template
  min_transformers: "5.2.0"

lora:
  # r=16 is for format-following, which is exactly this task: the notation, the
  # line-unwrapping, the house style of `topic`. No new knowledge is being taught,
  # so a larger rank buys nothing and overfits a small set faster.
  r: 16
  alpha: 16
  dropout: 0.0
  bias: none
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  use_gradient_checkpointing: unsloth
  use_rslora: false
  random_state: 3407

data:
  # TODO: no analysis data exists yet. These paths are placeholders, kept apart
  # from the extraction data so neither build overwrites the other.
  #
  # Built by preparation/build.py from raw/<folder>/annotation.txt:
  # Split : Train -> train.jsonl, Split : Validation -> eval.jsonl. Test folders
  # go to test.jsonl, which training never reads. Row and clause counts are in
  # preparation/data/build-report.json. Delete the eval line to train with no
  # Validation folders; run.sh stops early if a named file is missing.
  train: preparation/data/analysis/train.jsonl
  eval:  preparation/data/analysis/eval.jsonl
  train_on_responses_only: true     # loss on the assistant turn only

train:
  # TODO: copied from extraction. Re-size once the analysis row count is known.
  # Sized for a few dozen long rows (the 2026-10-10 ten-document build gave 39,
  # ~6k answer tokens of loss each at the median). Effective batch 2 -> about
  # rows/2 optimiser steps an epoch. Aim for 50+ steps in total, so warmup is
  # more than a step or two. Once most of the ~60 folders are Train there will
  # be a couple of hundred rows, and gradient_accumulation_steps 4 fits better.
  # Re-check against build-report.json's train row count before each run.
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 2
  num_train_epochs: 3
  max_steps: -1
  learning_rate: 2.0e-4
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  optim: adamw_torch_fused
  weight_decay: 0.01
  logging_steps: 1
  save_strategy: steps
  save_steps: 20
  save_total_limit: 3
  eval_steps: 10
  per_device_eval_batch_size: 1
  packing: false            # packing corrupts loss masking on chat data
  seed: 3407
  resume: false

output:
  adapter_dir: training/adapters/pbbi-analysis-lora-v0.1.0
  push_to_hub: scalejade/pbbi-analysis-lora      # created on the first push
  private: true

  # auto  -> next patch after the tags already on the repo (v0.1.0, v0.1.1, ...)
  # v0.2.0 -> that exact tag; refused before training starts if it already exists
  # null  -> push to main untagged. Do not: main is whatever ran last, which is
  #          the failure the base model's pinned sha exists to avoid.
  # Resolved BEFORE the GPU work, so a taken tag costs nothing.
  version: auto
  merge_16bit: false        # adapter only; a merged 27B is 55 GB of upload

tracking:
  wandb_project: scalejade-mlops

  # TODO: the quality check scores replies with the EXTRACTION parser, which says
  # nothing about analysis. Off until analysis has its own scorer.
  #
  # Extraction quality (training/metrics.md, "quality/"): generate the reply for the
  # first quality_rows validation rows and score it with the app's own parser,
  # preparation/app_request.py — JSON valid, finished, clause recall / precision.
  # The only metric about the product, not the optimiser. Costs H200 time: ~3-6 min
  # per row, so 2 rows x 3 epochs is ~20-35 min (~$2-3). epoch | end | never.
  quality_check: never
  quality_rows: 2
  quality_max_new_tokens: 24576   # the endpoint's request_defaults.max_tokens

  # eval/loss split by these annotation.txt fields, plus an eval/rows table of every
  # validation row's loss. Free: it reuses the losses the eval pass computes anyway.
  # Needs build-report.json next to eval.jsonl (make train-push-data copies it).
  eval_group_by: [Produk, Kombinasi]   # TODO: only if analysis rows carry these annotation fields
