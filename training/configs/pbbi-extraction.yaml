# PBBI clause extraction — LoRA, one H200.
# The config IS the experiment record: train.py takes no hyperparameter flags,
# so anything not written here did not happen and cannot be reproduced.
#
#   python preparation/build.py --tokenizer scalejade/qwen-sea-lion-v4.5-27b-pbbi --max-row-tokens 1000000
#   python training/scripts/train.py training/configs/pbbi-extraction.yaml --dry-run
#   python training/scripts/train.py training/configs/pbbi-extraction.yaml
#
# Trained on the app's own request shape (perjanjian-baku-bi, sys-prompt @ e028187):
# system = extraction_system.md verbatim, user = "DOCUMENT:\n" + served PDF text.
# See preparation/README.md, "The serving contract".

run_name: pbbi-clause-extraction-lora-v0.1.0

model:
  # The app's extraction model on sys-prompt is scalejade/qwen-sea-lion-v4.5-27b-it
  # (domain.RunPodModelSeaLion). This is the dedicated PBBI clone of those same
  # weights, so the adapter attaches to what the app calls.
  base: scalejade/qwen-sea-lion-v4.5-27b-pbbi
  revision: 8d32a4b9c89c9272ae8d660792182da7950955a2

  # One row per document, never windowed (build.py --max-row-tokens 1000000).
  # 2026-10-17 full build, 60 documents, exact tokenizer counts (system 13,963 of
  # each row). Longest rows:
  #   train  UOB Mobile Banking   89,298   <- sets this value
  #   train  JAGO Mobile Banking  88,466
  #   test   SEABANK MB           81,959   (never trained on; served at 262k)
  #   eval   OVO UE Server-Based  71,766
  # Median row ~27k (train) / ~33k (eval). 98,304 leaves ~9k for the chat template.
  # No packing at batch 1, so peak VRAM follows the actual row, not this number.
  # Measured on the H200 (2026-10-17, v0.1.1): a 42k train row peaked at 74 GB of
  # 141; the 89k rows are UNMEASURED (estimate ~100-110 GB). Before the real run:
  #   training/scripts/test.py --data preparation/data/train.jsonl --max-seq-length 98304 --steps 2
  # On OOM, window the longest rows (build.py --max-row-tokens 80000) rather than
  # 4-bit: QLoRA is reported to degrade on this hybrid-attention architecture.
  max_seq_length: 98304

  load_in_4bit: false       # 55.56 GB of weights on 141 GB; see above before turning this on
  dtype: bfloat16           # qwen3_5's gated-deltanet layers NaN their grads in fp16
  text_only: true           # skip the vision tower: ~2.4 GB less VRAM
  chat_template: qwen-3     # names the response markers only; does NOT replace the repo's template
  min_transformers: "5.2.0"

lora:
  # r=16 is for format-following, which is exactly this task: the notation, the
  # line-unwrapping, the house style of `topic`. No new knowledge is being taught,
  # so a larger rank buys nothing and overfits a small set faster.
  r: 16
  alpha: 16
  dropout: 0.0
  bias: none
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  use_gradient_checkpointing: unsloth
  use_rslora: false
  random_state: 3407

data:
  # Built by preparation/build.py from raw/<folder>/annotation.txt:
  # Split : Train -> train.jsonl, Split : Validation -> eval.jsonl. Test folders
  # go to test.jsonl, which training never reads. Row and clause counts are in
  # preparation/data/build-report.json. Delete the eval line to train with no
  # Validation folders; run.sh stops early if a named file is missing.
  train: preparation/data/train.jsonl
  eval:  preparation/data/eval.jsonl
  train_on_responses_only: true     # loss on the assistant turn only

train:
  # Sized for the 2026-10-17 full build: 31 train rows (3,206 clauses, ~1.0M
  # tokens), 12 eval rows. Effective batch 2 -> 16 optimiser steps an epoch,
  # 48 over 3 epochs; warmup 0.1 = 5 steps. Eval every 8 steps = 6 passes over
  # the 12 eval rows (~3 min each). Saved once an epoch.
  # Time on the H200 (step on a 42k row measured at 96 s): ~2 h of steps +
  # ~20 min of eval + ~10 min load, so ~2.5 h, ~$13 at $5.29/hr.
  # (A 1-row run, like v0.1.1, wants gradient_accumulation_steps 1, warmup 0,
  # eval_steps 1, save_steps 1.) Re-check against build-report.json before each run.
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 2
  num_train_epochs: 3
  max_steps: -1
  learning_rate: 2.0e-4
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  optim: adamw_torch_fused
  weight_decay: 0.01
  logging_steps: 1
  save_strategy: steps
  save_steps: 16            # once an epoch
  save_total_limit: 3
  eval_steps: 8             # twice an epoch
  per_device_eval_batch_size: 1
  packing: false            # packing corrupts loss masking on chat data
  seed: 3407
  resume: false

output:
  adapter_dir: training/adapters/pbbi-clause-extraction-lora-v0.1.0
  push_to_hub: scalejade/pbbi-clause-extraction-lora
  private: true

  # auto  -> next patch after the tags already on the repo (v0.1.0, v0.1.1, ...)
  # v0.2.0 -> that exact tag; refused before training starts if it already exists
  # null  -> push to main untagged. Do not: main is whatever ran last, which is
  #          the failure the base model's pinned sha exists to avoid.
  # Resolved BEFORE the GPU work, so a taken tag costs nothing.
  version: auto
  merge_16bit: false        # adapter only; a merged 27B is 55 GB of upload

tracking:
  wandb_project: scalejade-mlops

  # Extraction quality (training/metrics.md, "quality/"): generate the reply for the
  # first quality_rows validation rows and score it with the app's own parser,
  # preparation/app_request.py — JSON valid, finished, clause recall / precision.
  # The only metric about the product, not the optimiser — but OPTIONAL: off by
  # default, opt in per run. On whole documents it is the most expensive part of
  # the run: OVO's 34,621-token answer took 15-20+ min per check on 2026-10-17
  # (HF generate, not vLLM), vs ~2 min per training step. Score the adapter on
  # test.jsonl afterwards instead (runpod/pbbi-eval).
  #   never  off (default)
  #   end    once, after the last step — the one to use with few steps
  #   epoch  after every epoch — worth it once there are dozens of train rows
  quality_check: never
  quality_rows: 2
  # Must exceed the longest eval answer (OVO, 34,621) or the check scores it
  # unfinished. The endpoint's request_defaults.max_tokens (24,576) is now BELOW
  # what whole documents need (ShopeePay 30,115, OVO 34,621) and must follow.
  quality_max_new_tokens: 40960

  # eval/loss split by these annotation.txt fields, plus an eval/rows table of every
  # validation row's loss. Free: it reuses the losses the eval pass computes anyway.
  # Needs build-report.json next to eval.jsonl (make train-push-data copies it).
  eval_group_by: [Produk, Kombinasi]
