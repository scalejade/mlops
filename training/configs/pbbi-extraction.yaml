# PBBI clause extraction — LoRA, one H200.
# The config IS the experiment record: train.py takes no hyperparameter flags,
# so anything not written here did not happen and cannot be reproduced.
#
#   python preparation/build.py --tokenizer scalejade/qwen-sea-lion-v4.5-27b-pbbi --max-row-tokens 1000000
#   python training/scripts/train.py training/configs/pbbi-extraction.yaml --dry-run
#   python training/scripts/train.py training/configs/pbbi-extraction.yaml
#
# Trained on the app's own request shape (perjanjian-baku-bi, sys-prompt):
# system = extraction_system.md verbatim = prompt v4.8.1 (2026-11-21, docs/pbbi/prompts/14-v4.8.1.md;
# was @ 1d7ccdd until v0.1.4), user = "DOCUMENT:\n" + served PDF text (pdf_extractor.go @ e028187).
# Labels: Legal's xlsx, overridden in 36 documents (22 train, 3 eval, 11 test) by
# raw/*/*.gold.json: pass 1 = supervisor answers R1-R21 + team decisions K1-K9, pass 2 =
# every label aligned to prompt v4.8.1 (docs/pbbi/relabel-v0.1.5.md). The app must serve
# v4.8.1 with this adapter. Longest row with v4.8.1: 99,737 tokens.
# See preparation/README.md, "The serving contract".

run_name: pbbi-clause-extraction-lora-v0.1.5

model:
  # The app's extraction model on sys-prompt is scalejade/qwen-sea-lion-v4.5-27b-it
  # (domain.RunPodModelSeaLion). This is the dedicated PBBI clone of those same
  # weights, so the adapter attaches to what the app calls.
  base: scalejade/qwen-sea-lion-v4.5-27b-pbbi
  revision: 8d32a4b9c89c9272ae8d660792182da7950955a2

  # One row per document, never windowed (build.py --max-row-tokens 1000000).
  # 2026-11-18 v0.1.4 trial build, 85 documents, exact tokenizer counts (system
  # 14,282 of each row, prompt @ 1d7ccdd). Longest rows:
  #   train  UOB Mobile Banking   89,619   <- sets this value
  #   train  JAGO Mobile Banking  88,785
  #   test   SEABANK MB           82,278   (never trained on; served at 262k)
  #   eval   OVO UE Server-Based  72,085
  # Median row ~27k (train) / ~33k (eval).
  # 2026-11-20: raised 98,304 -> 102,400 for prompt v4.5 (system 24,958 tokens).
  # 2026-11-21: raised 102,400 -> 106,496 for prompt v4.6 (docs/pbbi/prompts/10-v4.6.md),
  # system 26,201 tokens (+11,919 vs 1d7ccdd). Same answers, new system:
  #   train  UOB Mobile Banking  101,538   <- with v4.6; with v4.7 (22,739 tokens, 21 Nov) ~98,080
  #   train  JAGO Mobile Banking 100,704
  # 2026-11-21 v0.1.5 build (prompt v4.8.1, 24,012 tokens; labels relabel pass 2): longest
  # rows UOB MB 99,737 and JAGO MB 98,795 (train), OVO 82,716 (eval), SEABANK MB 93,067
  # (test); median ~40k (train) / ~38k (eval).
  # Every row must stay <= 106,496 in build-report.json. Base serves 262,144, so this
  # is a training cap only.
  # No packing at batch 1, so peak VRAM follows the actual row, not this number.
  # Measured on the H200: a 42k train row peaked at 74.2 GB (v0.1.1, 2026-10-17); the
  # 89,298-token UOB row peaked at 103.2 GB of 141 (memory test before v0.1.4); the
  # v0.1.4 run itself peaked at 100.4 GB. Slope ~0.61 GB per 1k tokens, so the 99,737
  # UOB row extrapolates to ~110 GB and 106,496 to ~114 GB. Not measured at these
  # lengths yet. Before the real run (test.py defaults to the -it repo; pin this one):
  #   training/scripts/test.py --model scalejade/qwen-sea-lion-v4.5-27b-pbbi \
  #     --revision 8d32a4b9c89c9272ae8d660792182da7950955a2 \
  #     --data preparation/data/train.jsonl --max-seq-length 106496 --steps 2
  # On OOM, window the longest rows (build.py --max-row-tokens 80000) rather than
  # 4-bit: QLoRA is reported to degrade on this hybrid-attention architecture.
  max_seq_length: 106496

  load_in_4bit: false       # 55.56 GB of weights on 141 GB; see above before turning this on
  dtype: bfloat16           # qwen3_5's gated-deltanet layers NaN their grads in fp16
  text_only: true           # skip the vision tower: ~2.4 GB less VRAM
  chat_template: qwen-3     # names the response markers only; does NOT replace the repo's template
  min_transformers: "5.2.0"

lora:
  # r=16 is for format-following, which is exactly this task: the notation, the
  # line-unwrapping, the house style of `topic`. No new knowledge is being taught,
  # so a larger rank buys nothing and overfits a small set faster.
  r: 16
  alpha: 16
  dropout: 0.0
  bias: none
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  use_gradient_checkpointing: unsloth
  use_rslora: false
  random_state: 3407

data:
  # Built by preparation/build.py from raw/<folder>/annotation.txt:
  # Split : Train -> train.jsonl, Split : Validation -> eval.jsonl. Test folders
  # go to test.jsonl, which training never reads. Row and clause counts are in
  # preparation/data/build-report.json. Delete the eval line to train with no
  # Validation folders; run.sh stops early if a named file is missing.
  train: preparation/data/train.jsonl
  eval:  preparation/data/eval.jsonl
  train_on_responses_only: true     # loss on the assistant turn only

train:
  # Sized for the v0.1.4 build (docs/pbbi/reports/v0.1.4.md, split 58/9/18):
  # 58 train rows (33 original + 25 new, ~6.9k clauses), 9 eval rows (BNI MB, CIMB KD,
  # JAMBI KD, OVO, MANDIRI UE Chip, MAYBANK MB&IB, UOB KK, STANCHART IB, MEGA KK;
  # 837 clauses). Effective batch 2 -> 29 optimiser steps, 1 epoch (plan section 5:
  # v0.1.2 and v0.1.3 both picked step 20 of 40, i.e. inside epoch 1). Test is the
  # 17 old rows + KALSEL KD (reported separately), so v0.1.3's test F1 compares.
  #
  # v0.1.3 build (2026-10-17): 39 train rows (4,381 clauses), 4 eval rows.
  #
  # 2026-10-17, lr 2e-4 x 3 epochs OVERFIT inside epoch 1: train loss 0.07 ->
  # 1e-5 by step 11, eval loss 0.165 (step 8) -> 0.232 (step 16); stopped at
  # step 16, nothing pushed (log: /workspace/train.lr2e-4.log on the pod). Each
  # step is ~48k answer tokens, so a step at 2e-4 moves the adapter a long way.
  # v0.1.3: lr 5e-5, 2 epochs (40 steps), eval + save every 4 steps, load_best
  # pushes the lowest-eval-loss checkpoint, not the last one.
  # v0.1.4: same lr, 1 epoch (29 steps, warmup 3). Estimate: ~50-70 s a step,
  # ~2-3 min an eval pass (9 rows) x 7 -> ~45-60 min.
  # v0.1.5 (2026-11-21 build): same 58/9/18 documents and the same settings, so again
  # 29 steps. Labels: 6,991 train clauses (v0.1.4: 6,917), 854 eval (837), 2,209 test (2,178).
  # The system prompt is now ~24k tokens (was 14k), so every row is ~10k tokens longer
  # and steps run somewhat slower; loss is still on the answer only.
  # (A 1-row run, like v0.1.1, wants gradient_accumulation_steps 1, warmup 0,
  # eval_steps 1, save_steps 1.) Re-check against build-report.json before each run.
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 2
  num_train_epochs: 1
  max_steps: -1
  learning_rate: 5.0e-5
  warmup_ratio: 0.1
  load_best: true
  lr_scheduler_type: linear
  optim: adamw_torch_fused
  weight_decay: 0.01
  logging_steps: 1
  save_strategy: steps
  save_steps: 4             # with every eval, so load_best can pick any of them
  save_total_limit: 2       # the best and the latest (load_best keeps the best)
  eval_steps: 4             # 4 times an epoch: catches the turn before it overfits
  per_device_eval_batch_size: 1
  packing: false            # packing corrupts loss masking on chat data
  seed: 3407
  resume: false

output:
  adapter_dir: training/adapters/pbbi-clause-extraction-lora-v0.1.5
  push_to_hub: scalejade/pbbi-clause-extraction-lora
  private: true

  # auto  -> next patch after the tags already on the repo (v0.1.0, v0.1.1, ...)
  # v0.2.0 -> that exact tag; refused before training starts if it already exists
  # null  -> push to main untagged. Do not: main is whatever ran last, which is
  #          the failure the base model's pinned sha exists to avoid.
  # Resolved BEFORE the GPU work, so a taken tag costs nothing.
  version: v0.1.5             # pinned: refused before training if the tag exists
  merge_16bit: false        # adapter only; a merged 27B is 55 GB of upload

tracking:
  wandb_project: scalejade-mlops

  # Extraction quality (training/metrics.md, "quality/"): generate the reply for the
  # first quality_rows validation rows and score it with the app's own parser,
  # preparation/app_request.py — JSON valid, finished, clause recall / precision.
  # The only metric about the product, not the optimiser — but OPTIONAL: off by
  # default, opt in per run. On whole documents it is the most expensive part of
  # the run: OVO's 34,621-token answer took 15-20+ min per check on 2026-10-17
  # (HF generate, not vLLM), vs ~2 min per training step. Score the adapter on
  # test.jsonl afterwards instead (runpod/pbbi-eval).
  #   never  off (default)
  #   end    once, after the last step — the one to use with few steps
  #   epoch  after every epoch — worth it once there are dozens of train rows
  quality_check: never
  quality_rows: 2
  # Must exceed the longest eval answer (OVO, 34,621; 35,522 in the v0.1.5 build) or
  # the check scores it unfinished. Longest test answer in v0.1.5: 43,509 (SEABANK MB),
  # above this cap: scoring test.jsonl needs max_tokens >= ~45k.
  # The endpoint's request_defaults.max_tokens (24,576) is now BELOW
  # what whole documents need (ShopeePay 30,115, OVO 34,621) and must follow.
  quality_max_new_tokens: 40960

  # eval/loss split by these annotation.txt fields, plus an eval/rows table of every
  # validation row's loss. Free: it reuses the losses the eval pass computes anyway.
  # Needs build-report.json next to eval.jsonl (make train-push-data copies it).
  eval_group_by: [Produk, Kombinasi]
